<!DOCTYPE html>
<html>

<head>
  <title>Gneissmp world map</title>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <!-- OpenLayers CSS -->
  <link rel="stylesheet" type="text/css"
    href="https://cdn.jsdelivr.net/gh/openlayers/openlayers.github.io@master/en/v6.9.0/css/ol.css"
    integrity="sha256-jckPZk66EJrEBQXnJ5QC2bD+GxWPDRVVoMGr5vrMZvM=" crossorigin="anonymous">

  <!-- OpenLayers JS -->
  <script src="https://cdn.jsdelivr.net/gh/openlayers/openlayers.github.io@master/en/v6.9.0/build/ol.js"
    integrity="sha256-77dogUPZ1WVoK9BDF0CxsKnAouX3YzK6n4tIcbDgtFI=" crossorigin="anonymous"></script>


  <!-- Map metadata generated by uNmINeD -->
  <script type="text/javascript" src="server-map/unmined.map.properties.js"></script>
  <script type="text/javascript" src="server-map/unmined.map.regions.js"></script>

  <!-- uNmINeD JS -->
  <script type="text/javascript" src="server-map/unmined.openlayers.js"></script>

  <style type="text/css">
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: black;
    }

    #map {
      height: 100%;
      width: 100%;
      image-rendering: pixelated;
    }

    .mouseposition {
      background-color: black;
      padding: 3px;
      text-align: right;
    }

    .mousepositioncoord {
      min-width: 40px;
      display: inline-block;
    }

    div.ol-mouse-position {
      background-color: white;
      padding: 6px;
      border-radius: 3px;
      box-shadow: 3px 3px 2px rgba(0, 0, 0, 0.2);
    }
  </style>

</head>

<body>
  <div id="map"></div>

  <script type="text/javascript">

    document.title = UnminedMapProperties.worldName + " - " + document.title;
    const queryParams = new URLSearchParams(window.location.search);

    queryParams.forEach((value, key) => {
      UnminedMapProperties.markers.push({
        x: value.split(",")[0],
        z: value.split(",")[1],
        image: "server-map/pin.png",
        imageAnchor: [0.5, 1],
        imageScale: 0.5,
        text: key.charAt(0).toUpperCase() + key.slice(1),
        textColor: "red",
        offsetX: 0,
        offsetY: 20,
        font: "bold 20px Calibri,sans serif",
      })
    })

    let unmined = new Unmined();

    unmined.map('map', UnminedMapProperties, UnminedRegions);

  </script>
</body>

</html>
